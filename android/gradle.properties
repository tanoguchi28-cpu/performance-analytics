org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP9のBuilt-in Kotlin移行に未対応のプラグインが多く、file_picker/app_links等で
# 相互に矛盾するビルド失敗が起きたため、AGP8系にダウングレードした
# （settings.gradle.kts参照）。newDsl/builtInKotlinはAGP9固有のフラグなので不要。
# プロジェクト(D:)とpub-cache(C:)がドライブをまたぐ環境では、Kotlin incremental
# compilerが相対パスを計算できず "this and base files have different roots" で
# ビルドが失敗するため無効化する。
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
